# The main pipeline for my_bundle

resources:
  pipelines:
    employees-etl:
      name: employees-etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/etl/pipelines/employees-etl"

      libraries:
        - glob:
            include: ../src/etl/pipelines/employees-etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
