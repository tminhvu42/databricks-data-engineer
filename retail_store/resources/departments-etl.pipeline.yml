# The main pipeline for my_bundle

resources:
  pipelines:
    departments-etl:
      name: departments-etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/etl/pipelines/departments-etl"
      configuration:
        "bronze_schema": "bronze"
        "gold_schema": "gold"
        "shared_dir_path": /Workspace/Users/${workspace.current_user.userName}/databricks-data-engineer/retail_store/shared/
        "silver_schema": "silver"
        "source_path": "/Volumes/retail_store/bronze/raw_data"
      libraries:
        - glob:
            include: ../src/etl/pipelines/departments-etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
